# ---------------------------------------------------------------------------
# Conexion a Ollama
# En docker-compose la variable SPRING_AI_OLLAMA_BASE_URL=http://ollama:11434
# sobreescribe este valor automaticamente (relaxed binding).
# ---------------------------------------------------------------------------
spring.ai.ollama.base-url=http://localhost:11434

# ---------------------------------------------------------------------------
# Modelo de chat
# OJO: la propiedad es spring.ai.ollama.chat.model (SIN el segmento .options).
# spring.ai.ollama.chat.enabled fue eliminado; usar spring.ai.model.chat.
# ---------------------------------------------------------------------------
spring.ai.model.chat=ollama
spring.ai.ollama.chat.model=gemma3:4b
spring.ai.ollama.chat.temperature=0.7
spring.ai.ollama.chat.num-predict=1024
spring.ai.ollama.chat.num-ctx=4096

# ---------------------------------------------------------------------------
# RAG - embeddings y almacenamiento vectorial
# El modelo de chat y el de embeddings cumplen funciones diferentes.
# nomic-embed-text produce vectores de 768 dimensiones.
# ---------------------------------------------------------------------------
spring.ai.model.embedding=ollama
spring.ai.ollama.embedding.model=nomic-embed-text

spring.datasource.url=jdbc:postgresql://localhost:5432/ragdb
spring.datasource.username=rag
spring.datasource.password=rag
spring.ai.vectorstore.pgvector.initialize-schema=true
spring.ai.vectorstore.pgvector.dimensions=768
spring.ai.vectorstore.pgvector.distance-type=COSINE_DISTANCE
spring.ai.vectorstore.pgvector.index-type=HNSW

spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=20MB

# ---------------------------------------------------------------------------
# Descarga automatica del modelo si no esta presente en el contenedor de Ollama.
# El valor por defecto es "never". Con when_missing ya no dependes del
# entrypoint del docker-compose para tener llama3 disponible.
# La aplicacion NO termina de arrancar hasta que el modelo este descargado.
# ---------------------------------------------------------------------------
spring.ai.ollama.init.pull-model-strategy=never
spring.ai.ollama.init.timeout=10m
spring.ai.ollama.init.max-retries=1

# ---------------------------------------------------------------------------
# Timeouts del cliente HTTP que Spring AI reutiliza para hablar con Ollama.
# Sin esto, una inferencia lenta en CPU puede colgar el hilo indefinidamente.
# ---------------------------------------------------------------------------
spring.http.client.connect-timeout=5s
spring.http.client.read-timeout=180s

# ---------------------------------------------------------------------------
# Logging
# ---------------------------------------------------------------------------
logging.level.org.springframework.ai=DEBUG
logging.level.com.example.chat=DEBUG
