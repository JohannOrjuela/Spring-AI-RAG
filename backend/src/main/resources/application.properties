
# ---------------------------------------------------------------------------
# Conexion a Ollama
# Docker Compose sobreescribe esta URL con:
# SPRING_AI_OLLAMA_BASE_URL=http://ollama:11434
# ---------------------------------------------------------------------------
spring.ai.ollama.base-url=http://localhost:11434

# ---------------------------------------------------------------------------
# Modelo de chat
# Conservamos Gemma 3 4B.
# Se limita la respuesta a 256 tokens para reducir el trabajo de generacion.
# ---------------------------------------------------------------------------
spring.ai.model.chat=ollama
spring.ai.ollama.chat.model=gemma3:4b
spring.ai.ollama.chat.temperature=0.7
spring.ai.ollama.chat.num-predict=256
spring.ai.ollama.chat.num-ctx=4096

# ---------------------------------------------------------------------------
# RAG - Modelo de embeddings
# nomic-embed-text genera vectores de 768 dimensiones.
# ---------------------------------------------------------------------------
spring.ai.model.embedding=ollama
spring.ai.ollama.embedding.model=nomic-embed-text

# ---------------------------------------------------------------------------
# RAG - PostgreSQL y PGVector
# Docker Compose sobreescribe la URL con el host pgvector.
# ---------------------------------------------------------------------------
spring.datasource.url=jdbc:postgresql://localhost:5432/ragdb
spring.datasource.username=rag
spring.datasource.password=rag

spring.ai.vectorstore.pgvector.initialize-schema=true
spring.ai.vectorstore.pgvector.dimensions=768
spring.ai.vectorstore.pgvector.distance-type=COSINE_DISTANCE
spring.ai.vectorstore.pgvector.index-type=HNSW

# ---------------------------------------------------------------------------
# Carga de documentos
# ---------------------------------------------------------------------------
spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=20MB

# ---------------------------------------------------------------------------
# Inicializacion de Ollama
# Los modelos ya se descargan mediante Docker Compose.
# ---------------------------------------------------------------------------
spring.ai.ollama.init.pull-model-strategy=never
spring.ai.ollama.init.timeout=10m
spring.ai.ollama.init.max-retries=1

# ---------------------------------------------------------------------------
# Timeouts HTTP
# ---------------------------------------------------------------------------
spring.http.client.connect-timeout=5s
spring.http.client.read-timeout=180s

# ---------------------------------------------------------------------------
# Logging
# ---------------------------------------------------------------------------
logging.level.org.springframework.ai=DEBUG
logging.level.com.example.chat=DEBUG

# ---------------------------------------------------------------------------
# Experimentos RAG - Reto 2
# Valores configurables mediante variables de entorno.
#
# Chunk size: 500 tokens
# topK: 1 fragmento recuperado
# Umbral minimo de similitud: 0.5
# ---------------------------------------------------------------------------
rag.chunk-size=${RAG_CHUNK_SIZE:500}
rag.top-k=${RAG_TOP_K:1}
rag.similarity-threshold=${RAG_SIMILARITY_THRESHOLD:0.5}
