
services:

  # =========================================================
  # OLLAMA - Servidor de modelos de inteligencia artificial
  # =========================================================
  ollama:
    image: "ollama/ollama:latest"
    container_name: pruebachat_ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  # =========================================================
  # DESCARGA DEL MODELO DE CHAT - GEMMA 3 4B
  # =========================================================
  ollama-pull:
    image: "ollama/ollama:latest"
    container_name: pruebachat_ollama_pull
    environment:
      - OLLAMA_HOST=http://ollama:11434
    command: ["pull", "gemma3:4b"]
    restart: "no"
    depends_on:
      ollama:
        condition: service_healthy

  # =========================================================
  # MODELO DE EMBEDDINGS - NOMIC EMBED TEXT
  # =========================================================
  ollama-pull-embed:
    image: "ollama/ollama:latest"
    container_name: pruebachat_ollama_pull_embed
    environment:
      - OLLAMA_HOST=http://ollama:11434
    command: ["pull", "nomic-embed-text"]
    restart: "no"
    depends_on:
      ollama:
        condition: service_healthy

  # =========================================================
  # POSTGRESQL + PGVECTOR
  # =========================================================
  pgvector:
    image: "pgvector/pgvector:pg17"
    container_name: pruebachat_pgvector
    environment:
      - POSTGRES_DB=ragdb
      - POSTGRES_USER=rag
      - POSTGRES_PASSWORD=rag
    ports:
      - "5432:5432"
    volumes:
      - pgvector_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rag -d ragdb"]
      interval: 5s
      timeout: 5s
      retries: 12

  # =========================================================
  # BACKEND SPRING BOOT + SPRING AI + RAG
  # =========================================================
  backend:
    build: ../backend
    container_name: pruebachat_backend
    ports:
      - "8080:8080"
    environment:
      - SPRING_AI_OLLAMA_BASE_URL=http://ollama:11434
      - SPRING_DATASOURCE_URL=jdbc:postgresql://pgvector:5432/ragdb

      # =====================================================
      # CONFIGURACION FINAL - MEJOR RESULTADO OBSERVADO
      # chunkSize = 500 tokens
      # topK = 2 fragmentos recuperados como maximo
      # similarityThreshold = 0.5
      #
      # Resultado de las pruebas: 6/7 respuestas correctas
      # =====================================================
      - RAG_CHUNK_SIZE=${RAG_CHUNK_SIZE:-500}
      - RAG_TOP_K=${RAG_TOP_K:-2}
      - RAG_SIMILARITY_THRESHOLD=${RAG_SIMILARITY_THRESHOLD:-0.5}

    depends_on:
      ollama:
        condition: service_healthy
      ollama-pull:
        condition: service_completed_successfully
      ollama-pull-embed:
        condition: service_completed_successfully
      pgvector:
        condition: service_healthy

  # =========================================================
  # FRONTEND - INTERFAZ WEB
  # =========================================================
  frontend:
    build: ../frontend
    container_name: pruebachat_frontend
    ports:
      - "4200:4200"
    depends_on:
      - backend

# ===========================================================
# VOLUMENES PERSISTENTES
# Conservan modelos Ollama y datos PGVector entre reinicios.
# ===========================================================
volumes:
  ollama_data:
    driver: local

  pgvector_data:
    driver: local
